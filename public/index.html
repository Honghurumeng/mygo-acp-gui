<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>pi · ACP</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo">π</span>
        <span class="brand-text">pi</span>
        <span class="tag">ACP</span>
      </div>
      <div class="meta">
        <span id="status" class="status is-connecting"><i></i><span id="statusText">连接中</span></span>
        <span id="cwd" class="cwd"></span>
      </div>
      <div class="actions">
        <div id="configs" class="configs"></div>
        <button id="newSession" class="ghost">新会话</button>
        <button id="toggleTraffic" class="ghost">报文</button>
      </div>
    </header>

    <main id="messages" class="messages">
      <div class="empty" id="empty">
        <div class="empty-title">pi 已接入 ACP</div>
        <p>左边是浏览器，右边是 <code>pi-acp</code> 适配器，中间走 JSON-RPC。</p>
        <ul>
          <li>Enter 发送，Shift+Enter 换行</li>
          <li>工具调用会实时显示状态，需要授权时会在这里弹出审批</li>
          <li>点右上角「报文」可以看双向 ACP 流量</li>
        </ul>
      </div>
    </main>

    <div id="permissionHost" class="permission-host"></div>

    <footer class="composer">
      <textarea id="input" rows="1" placeholder="给 pi 派活…"></textarea>
      <div class="composer-actions">
        <button id="send" class="primary">发送</button>
        <button id="stop" class="danger hidden">停止</button>
      </div>
    </footer>
  </div>

  <aside id="traffic" class="traffic hidden">
    <div class="traffic-head">
      <span>ACP 报文</span>
      <button id="closeTraffic" class="ghost">关闭</button>
    </div>
    <div id="trafficBody" class="traffic-body"></div>
  </aside>

  <script type="module" src="/app.js"></script>
</body>
</html>
